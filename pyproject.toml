[project]
name = "congress-speech"
version = "0.1.0"
description = "Can a language model hear polarization? Party prediction from Congressional Record floor speech, 1995-2026."
requires-python = ">=3.12"
# Lower bounds are deliberately loose so `pip install` on Colab keeps its
# preinstalled numpy/pandas/torch/scikit-learn; uv.lock pins exact versions locally.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "lxml>=5",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "plotly>=5.24",
    "mlflow==3.14.0",
    "optuna>=4.0",
    "huggingface_hub>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["congress_speech"]

[dependency-groups]
dev = ["pytest>=8"]
